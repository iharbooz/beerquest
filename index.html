<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Beer Tree Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fg:#f4f0e8;--mut:#cbc6bb;--gold:#e9c46a;--sage:#86c79a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--fg);
  background:
    radial-gradient(130% 55% at 50% 118%,rgba(214,150,60,.18),transparent 62%),
    radial-gradient(circle at 50% 38%,#383b40,#282b2f 58%,#1c1d20);
  font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#stage{position:fixed;inset:0;z-index:1;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#links line{stroke-width:2;stroke-linecap:round;opacity:.32}

.b{position:absolute;left:0;top:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  text-align:center;line-height:1.1;cursor:pointer;color:var(--fg);padding:4px;
  --g:color-mix(in srgb,var(--c) 28%,transparent);
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.12),transparent 52%),color-mix(in srgb,var(--c) 15%,#26282c);
  border:1.5px solid color-mix(in srgb,var(--c) 58%,transparent);
  box-shadow:0 0 14px var(--g)}
@media (hover:hover){.b:hover{border-color:var(--c);box-shadow:0 0 20px var(--g)}}
.b:focus-visible{outline:2px solid #fff;outline-offset:3px}
.b span{pointer-events:none}
.b em{position:absolute;top:100%;margin-top:4px;font-style:normal;font-size:13px;font-weight:500;color:#b4dcbf;white-space:nowrap;pointer-events:none}
.b.root{border-width:2px;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.14),transparent 52%),color-mix(in srgb,var(--c) 20%,#26282c)}
.b.tried{border:2.5px solid var(--sage);box-shadow:0 0 14px rgba(134,199,154,.32)}

#tools{position:fixed;z-index:5;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px}
button{font:inherit;color:var(--fg);cursor:pointer}
#tools button{width:44px;height:44px;font-size:19px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2)}
#tools button:hover{background:rgba(255,255,255,.16)}
#hint{position:fixed;z-index:5;right:16px;bottom:20px;font-size:13px;color:var(--mut);pointer-events:none;opacity:.8}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}

#scrim{position:fixed;inset:0;z-index:20;background:rgba(12,13,15,.5);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#card{position:fixed;z-index:30;display:none;overflow:hidden;border-radius:50%;
  background:
    linear-gradient(155deg,rgba(255,255,255,.04),rgba(255,255,255,.014) 38%,rgba(22,24,28,.08)),
    radial-gradient(circle at 15% 0,color-mix(in srgb,var(--c) 6%,transparent),transparent 55%);
  -webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid rgba(255,255,255,.3);
  box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent);
  transition:left .42s cubic-bezier(.2,.8,.2,1),top .42s cubic-bezier(.2,.8,.2,1),width .42s cubic-bezier(.2,.8,.2,1),height .42s cubic-bezier(.2,.8,.2,1),border-radius .42s}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#card{background:#2d3035}}
#card.show{display:block}
#cin{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:24px 22px 28px;opacity:0;transition:opacity .15s;text-shadow:0 1px 6px rgba(0,0,0,.4)}
#card.open #cin{opacity:1;transition:opacity .3s .22s}
#x{position:absolute;right:12px;top:12px;z-index:3;width:34px;height:34px;font-size:20px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
#pp{font-size:13px;color:var(--mut);margin-right:44px;min-height:16px}
#pn{margin:2px 0 10px;font-size:32px;font-weight:600;color:color-mix(in srgb,var(--c) 65%,#fff)}
#pd{margin:0 0 16px;font-size:16px;line-height:1.5;color:#f6f2ea}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:15px}
.kv span{color:var(--mut)}.kv b{font-weight:500;text-align:right}
.kv.col{flex-direction:column;gap:3px}.kv.col b{text-align:left;line-height:1.35}
#crit{margin:14px 0 18px;display:grid;gap:9px}
.cr{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.cr div{display:flex;gap:4px}
.cr i{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.17)}
.cr i.f{background:color-mix(in srgb,var(--c) 75%,#fff)}
h4{margin:0 0 6px;font-size:15px;font-weight:500;display:flex;justify-content:space-between;align-items:baseline}
h4 b{color:#b4dcbf;font-size:17px}
#stars{display:flex;gap:1px;margin-bottom:12px}
#stars button{flex:1;min-width:0;height:40px;padding:0;font-size:27px;line-height:1;background:none;border:0;color:rgba(255,255,255,.28)}
#stars button.on{color:var(--gold)}
#note{font-size:14px;line-height:1.4;color:var(--mut);margin:0 0 12px}
#fr{display:grid;gap:6px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:14px;font-size:15px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.row b{font-weight:600}.row b.part{font-weight:400;color:var(--mut)}

#join{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(12,13,15,.78);padding:16px}
#jf{width:min(360px,100%);padding:22px;border-radius:24px;background:linear-gradient(180deg,#34373c,#26282c);border:1px solid rgba(255,255,255,.25);box-shadow:0 18px 50px rgba(0,0,0,.5);display:grid;gap:12px}
#jf h3{margin:0;font-size:22px}
#jf label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
#jf input{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:#1f2124;color:var(--fg)}
#jf button{padding:10px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08)}
#jf .go{background:var(--gold);color:#2a2418;border-color:var(--gold);font-weight:600}
#jnote{font-size:13px;color:#f0b4b4;margin:0}
@media (max-width:600px){#hint{display:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"><div id="world"><svg id="links"></svg></div></div>

<div id="tools">
  <button id="zi" aria-label="Zoom in">+</button>
  <button id="zo" aria-label="Zoom out">−</button>
  <button id="zr" aria-label="Fit tree to screen">⤢</button>
  <button id="pf" aria-label="Profile and sync">👤</button>
</div>
<div id="hint">Pinch or scroll to zoom · drag to look around · tap a bubble</div>

<div id="scrim"></div>
<div id="card" role="dialog" aria-modal="true" aria-labelledby="pn">
  <div id="cin">
    <button id="x" aria-label="Close">×</button>
    <div id="pp"></div>
    <h2 id="pn"></h2>
    <p id="pd"></p>
    <div id="info">
      <div class="kv"><span>Крепость</span><b id="abv"></b></div>
      <div class="kv col"><span>С чем пить</span><b id="pair"></b></div>
      <div id="crit"></div>
    </div>
    <div id="rb">
      <h4><span id="myh">Your rating</span><b id="myv"></b></h4>
      <div id="stars" role="group" aria-label="Rating out of 10"></div>
      <p id="note"></p>
      <div id="fr"></div>
    </div>
  </div>
</div>

<div id="join" hidden>
  <form id="jf">
    <h3>Who is drinking?</h3>
    <label>Your unique username<input id="jn" maxlength="24" autocomplete="off"></label>
    <label>Room code (the same for you and your friend)<input id="jr" maxlength="24" autocomplete="off" autocapitalize="none"></label>
    <p id="jnote" hidden>Friend sync is off: the database address is not set in config.js yet.</p>
    <button class="go">Save</button>
    <button type="button" id="clr">Clear my ratings</button>
    <button type="button" id="jc">Cancel</button>
  </form>
</div>

<script src="config.js"></script>
<script>
/* ---------- SETTINGS ---------- */
// The Firebase address lives in config.js, so replacing index.html never erases it.
const CFG=Object.assign({DB_URL:""},window.BEER_CONFIG||{});

/* ---------- DATA: edit this to add or change beers ---------- */
// n(name, strength, food pairing, [bitterness, sweetness, sourness, body, aroma] (0–5), description, sub-beers)
const n=(name,abv,ex,crit,desc,kids=[])=>({name,abv,ex,crit,desc,kids});
const g=(name,desc,kids,o={})=>({name,desc,kids,group:true,...o});
const CL=["Горечь","Сладость","Кислотность","Плотность","Аромат"];

const TREE=g("Пиво","Пиво делают из воды, солода, хмеля и дрожжей, а вкус определяется тем, как именно бродят дрожжи. Поэтому пиво делится на эли (тёплое брожение), лагеры (холодное брожение) и «остальное»: гибриды и дикие, кислые сорта. Идите от центра по веткам: у каждого стиля свой характер.",[
 g("Ale","Эли варят на верховых дрожжах при тёплой температуре (15–24 °C), поэтому они получаются ароматными, фруктовыми и многогранными. В них часто слышны цитрусы, карамель, специи и обжаренный солод. Обычно эль плотнее и «разговорчивее» лагера.",[
  n("Pale Ale","4.5–6%","Бургеры, жареная курица, сытные салаты",[3,2,0,2,3],"Классический светлый эль золотисто-медного цвета с цитрусовым и травяным ароматом хмеля. Солодовая сладость уравновешивает горечь, поэтому пить легко. Отличная точка входа в мир хмелевого пива."),
  n("IPA","5.5–7.5%","Острые блюда, бургеры, выдержанные сыры",[4,1,0,2,5],"India Pale Ale: яркий хмелевой аромат грейпфрута, смолы и тропических фруктов. Горечь заметная, но у хорошего IPA она чистая и недолгая. Тело среднее, послевкусие сухое.",[
   n("West Coast IPA","6–7.5%","Барбекю, острые тако, чеддер",[5,1,0,2,5],"Прозрачный, сухой и очень горький, с запахом хвои, смолы и грейпфрутовой корки. Сладости почти нет, поэтому хмель звучит на полную громкость. Для тех, кто любит классическую «злую» горечь."),
   n("Hazy IPA","5.5–7.5%","Тайская кухня, креветки, цитрусовые десерты",[2,2,0,3,5],"Мутный, сочный и мягкий: пахнет манго, персиком и апельсиновым соком. Горечь низкая, текстура шелковистая, почти как у сока. Самый дружелюбный вид IPA для новичков."),
   n("Double IPA","8–10%","Жирное мясо, выдержанные сыры, морковный торт",[5,2,0,3,5],"Усиленный IPA с огромным количеством хмеля и алкоголя. Много смолы, цитрусов и тропических фруктов, тело плотное, а лёгкая сладость смягчает горечь. Пьют медленно.")]),
  n("Amber Ale","4.5–6.2%","Пицца, стейки, колбаски на гриле",[2,3,0,3,2],"Янтарный эль с карамельной и хлебной сладостью. Хмель умеренный и лишь добавляет травяные и цитрусовые нотки. Мягкий, сбалансированный и очень «застольный»."),
  n("Brown Ale","4–6%","Жареное мясо, грибы, орехи",[2,3,0,3,3],"Коричневый эль с нотами орехов, тоста, карамели и лёгкого шоколада. Горечь низкая, тело среднее, вкус тёплый и уютный. Похоже на хлебную корочку с ореховым маслом."),
  n("Porter","4.5–6.5%","Стейк, копчёности, шоколадный десерт",[2,3,0,3,3],"Тёмное пиво из обжаренного солода со вкусом какао, кофе и поджаренного хлеба. Горечь мягкая, тело среднее, сладость лёгкая. Мягче стаута, хорошо подходит для первого знакомства с тёмным."),
  n("Stout","4–8%","Устрицы, стейки, тёмный шоколад",[3,2,0,4,4],"Почти чёрное пиво с ярким вкусом обжаренного ячменя, кофе и тёмного шоколада. Горечь идёт не от хмеля, а от обжарки. Плотное, бархатистое, с долгим послевкусием.",[
   n("Dry Stout","4–4.5%","Устрицы, солёные закуски, тушёное мясо",[3,1,0,2,3],"Ирландский классик: очень тёмный, но лёгкий по телу и невысокий по градусу. Вкус сухой, с горчинкой обжаренного зерна и кофе. Часто подаётся с плотной сливочной пеной."),
   n("Milk Stout","4–6%","Тирамису, мороженое, брауни",[1,4,0,4,3],"Стаут с лактозой, которая не сбраживается и остаётся приятной сладостью. Вкус как у кофе с молоком и шоколадом, текстура сливочная. Горечи мало, пьётся почти как десерт."),
   n("Imperial Stout","8–12%","Чизкейк, тёмный шоколад, выдержанные сыры",[3,4,0,5,5],"Огромный, густой и крепкий. Горький шоколад, эспрессо, тёмные сухофрукты и тёплый алкоголь. Тело плотное, как сироп: пиво для долгого неторопливого вечера.")]),
  n("Wheat Beer","4.5–5.5%","Салаты, лёгкие закуски, морепродукты",[1,2,1,2,3],"Светлое, мягкое и освежающее пиво с большой долей пшеницы. Пшеница даёт нежную, «хлебную» текстуру и лёгкую кислинку. Горечи почти нет, поэтому оно отлично подходит для жаркого дня.",[
   n("Hefeweizen","4.5–5.5%","Баварские колбаски, брецели, сытный завтрак",[1,2,1,2,4],"Нефильтрованное немецкое пшеничное: мутное, с ароматом банана, гвоздики и жевательной резинки. Вкус мягкий, с лёгкой кислинкой и пышной пеной. Горечи почти нет."),
   n("Witbier","4.5–5%","Мидии, салаты, цитрусовые десерты",[1,2,1,2,4],"Бельгийское «белое» пиво со специями: пахнет кориандром и апельсиновой цедрой. Лёгкое, мутное, цитрусовое и слегка пряное. Очень освежающий, почти летний напиток.")]),
  n("Belgian Strong","7–12%","Жареная птица, мягкие сыры, десерты с сухофруктами",[2,3,0,4,4],"Крепкие бельгийские эли: фруктовые (изюм, груша, банан), пряные и согревающие. Тело насыщенное, но финиш сухой. Алкоголь хорошо спрятан, поэтому такие сорта коварны.",[
   n("Dubbel","6–7.5%","Тушёное мясо, дичь, десерты с карамелью",[2,4,0,4,4],"Тёмный бельгийский эль: изюм, чернослив, карамель и немного специй. Сладость средняя, горечь низкая, тело плотное. Напоминает хлебный пудинг с сухофруктами."),
   n("Tripel","8–10%","Курица, рыба, мягкие сыры",[2,3,0,3,4],"Золотистый, но крепкий. Груша, банан, лёгкая пряность и медовые оттенки, финиш сухой. Пьётся удивительно легко, хотя градус высокий.")]),
  n("Saison","5–8%","Козий сыр, рыба, салаты с травами",[3,1,1,1,4],"Фермерский эль: очень сухой, игристый, с оттенками перца, цитруса и трав. Лёгкое тело и яркая газация делают его освежающим. Горчинка средняя, кислинка едва заметна."),
  n("Barleywine","8–12%","Голубые сыры, десерты с орехами, вяленое мясо",[3,5,0,5,5],"«Ячменное вино»: насыщенное, сладкое и очень плотное. Карамель, мёд, сухофрукты и тёплый алкоголь, а хмель добавляет горечь для баланса. Пьют небольшими порциями, как ликёр.")
 ],{ang:200,span:190,cd:215}),

 g("Lager","Лагеры бродят на низовых дрожжах на холоде (7–13 °C) и потом неделями вызревают. Вкус получается чистым, чётким и лёгким, без лишних фруктовых оттенков. Это самое популярное пиво в мире, но среди лагеров есть и тёмные, и крепкие, и даже копчёные.",[
  n("Pilsner","4.5–5.5%","Рыба, курица, лёгкие закуски",[3,1,0,2,3],"Светлый лагер золотого цвета с чистым вкусом. Хлебный солод, цветочно-травяной хмель и заметная, но приятная горечь. Освежает и оставляет сухое послевкусие.",[
   n("Czech Pilsner","4.5–5%","Жареный сыр, свиные колбаски, кнедлики",[3,2,0,2,3],"Оригинальный пилзнер: насыщенный солод с оттенком хлебной корки и мёда. Хмель Saaz даёт цветочно-пряный аромат. Тело чуть плотнее обычного, горечь мягкая и округлая."),
   n("German Pils","4.5–5.2%","Свинина, жареная рыба, колбаски",[4,1,0,1,3],"Суше, легче и горче чешского. Аромат хмеля травяной и цветочный, вкус очень чистый, а послевкусие резкое и освежающее.")]),
  n("Helles","4.7–5.4%","Баварские сосиски, брецели, закуски",[1,2,0,2,2],"Мюнхенский светлый лагер: мягкий, хлебный и чуть сладковатый. Хмеля и горечи мало, поэтому пьётся легко и гладко. Идеален для первого знакомства с лагерами."),
  n("Märzen","5.5–6%","Жареная курица, свиная рулька, брецели",[2,3,0,3,2],"Янтарный лагер со вкусом тоста, карамели и хлебной корки. Сладость умеренная, горечь мягкая, тело среднее. Это классическое пиво Октоберфеста."),
  n("Dunkel","4.5–5.6%","Жареная свинина, грибы, хлеб с хрустящей корочкой",[1,3,0,3,3],"Тёмный баварский лагер: корочка чёрного хлеба, орехи и нотка карамели. Несмотря на цвет, тело среднее, а вкус мягкий. Горечь слабая."),
  n("Schwarzbier","4.4–5.4%","Мясо на гриле, колбаски, сыры",[2,2,0,2,3],"Чёрный лагер, но лёгкий: оттенки жареного зерна, какао и горького шоколада без тяжести. Тело среднее и чистое. Послевкусие сухое."),
  n("Bock","6–7.5%","Тушёное мясо, дичь, насыщенные сыры",[2,4,0,4,3],"Крепкий солодовый лагер: хлебный мякиш, карамель, тосты и лёгкий ореховый оттенок. Хмель почти не слышен. Сладость заметная, тело плотное.",[

/* ---------- LAYOUT (compact, no overlaps) ---------- */
const COLORS={Ale:"#c99a5b",Lager:"#7ea3ba",Others:"#a592bd",Beer:"#cdb98a"};
const R=[80,56,42,34],FONT=[26,18,13,11],DD=[0,175,205,110];
const nodes=[];
const wt=c=>c.kids&&c.kids.length?1+c.kids.length*.9:1;
function place(nd,depth,x,y,ang,span,color,parent,path){
  Object.assign(nd,{depth,x,y,bx:x,by:y,r:R[depth],c:color,ox:0,oy:0,vx:0,vy:0,s:1,ph:Math.random()*6.28,parent,path,root:depth===0});
  nodes.push(nd);
  const k=nd.kids||[],tot=k.reduce((s,c)=>s+wt(c),0);let acc=0;
  k.forEach(c=>{
    let a;
    if(depth===0)a=c.ang;
    else if(k.length===1)a=ang;
    else{const w=wt(c);a=ang-span/2+span*(acc+w/2)/tot;acc+=w}
    const rad=a*Math.PI/180,d=nd.cd||DD[depth+1];
    const cs=depth===0?c.span:((c.kids||[]).length>2?140:90);
    place(c,depth+1,x+Math.cos(rad)*d,y+Math.sin(rad)*d,a,cs,depth===0?COLORS[c.name]:color,nd,path.concat(nd.name));
  });
}
place(TREE,0,0,0,0,0,COLORS.Beer,null,[]);
function relax(iters,pull,push,gap){
  for(let it=0;it<iters;it++){
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||1,m=a.r+b.r+gap;
      if(d<m){const p=(m-d)/d*push;dx*=p;dy*=p;if(!a.root){a.x-=dx;a.y-=dy}if(!b.root){b.x+=dx;b.y+=dy}}
    }
    if(pull)nodes.forEach(q=>{if(!q.root){q.x+=(q.bx-q.x)*pull;q.y+=(q.by-q.y)*pull}});
  }
}
relax(300,.015,.25,12);
relax(600,0,.5,14);

/* ---------- STATE ---------- */
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const SK="beerTree.ratings.v2",PK="beerTree.profile.v2",SYK="beerTree.synced.v2";
const DB=CFG.DB_URL.replace(/\/$/,"");
const leavesOf=q=>q.kids&&q.kids.length?q.kids.flatMap(leavesOf):[q];
nodes.forEach(q=>{q.leaf=!(q.kids&&q.kids.length);q.L=leavesOf(q)});
const rateable=nodes.filter(q=>q.leaf),leafNames=new Set(rateable.map(q=>q.name));
const prune=o=>{const r={};for(const k in (o||{})){const v=+o[k];if(leafNames.has(k)&&v>=1&&v<=10)r[k]=Math.round(v)}return r};
let S=prune(load(SK,{}));          // my ratings: only last-level beers
let P=load(PK,null);               // { name, room }
let O=[];                          // other people in the room: [{name,d}]
let synced=load(SYK,false),dirty=false,ver=0;
const live=()=>!!(DB&&P&&P.name&&P.room);
const stat=(q,d)=>{let s=0,c=0;for(const l of q.L){const v=d[l.name]|0;if(v){s+=v;c++}}return{c,t:q.L.length,avg:c?s/c:0}};
const fmt=v=>Number.isInteger(v)?String(v):v.toFixed(1);

/* ---------- BUILD DOM ---------- */
const world=$("world"),links=$("links"),stage=$("stage"),NS="http://www.w3.org/2000/svg";
nodes.forEach(q=>{
  if(q.parent){const l=document.createElementNS(NS,"line");l.style.stroke=q.c;links.appendChild(l);q.line=l}
  const el=document.createElement("div");
  el.className="b"+(q.root?" root":"");el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label",q.name);
  el.style.cssText=`--c:${q.c};width:${q.r*2}px;height:${q.r*2}px;font-size:${FONT[q.depth]}px;font-weight:${q.depth<2?600:500}`;
  el.innerHTML="<span></span><em></em>";el.firstChild.textContent=q.name;
  el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openNode(q)}};
  el.__q=q;world.appendChild(el);q.el=el;q.em=el.lastChild;
});

/* ---------- VIEW: locked to the page; pinch + drag only inside the tree ---------- */
const view={x:0,y:0,k:1,dirty:true};
const MAXK=3;let minK=.3,B={x0:0,x1:1,y0:0,y1:1};
function measure(){
  B={x0:Math.min(...nodes.map(q=>q.x-q.r))-40,x1:Math.max(...nodes.map(q=>q.x+q.r))+40,
     y0:Math.min(...nodes.map(q=>q.y-q.r))-40,y1:Math.max(...nodes.map(q=>q.y+q.r))+60};
  minK=Math.min(innerWidth/(B.x1-B.x0),innerHeight/(B.y1-B.y0),1.2);
}
function clampView(){
  const w=(B.x1-B.x0)*view.k,h=(B.y1-B.y0)*view.k;
  view.x=w<=innerWidth?(innerWidth-w)/2-B.x0*view.k:Math.min(-B.x0*view.k,Math.max(innerWidth-B.x1*view.k,view.x));
  view.y=h<=innerHeight?(innerHeight-h)/2-B.y0*view.k:Math.min(-B.y0*view.k,Math.max(innerHeight-B.y1*view.k,view.y));
  view.dirty=true;
}
const fit=()=>{view.k=minK;clampView()};
function start(){view.k=Math.max(minK,innerWidth<600?.6:minK);view.x=innerWidth/2;view.y=innerHeight/2;clampView()}
function zoom(f,cx=innerWidth/2,cy=innerHeight/2){
  const k=Math.min(MAXK,Math.max(minK,view.k*f)),r=k/view.k;
  view.x=cx-(cx-view.x)*r;view.y=cy-(cy-view.y)*r;view.k=k;clampView();
}
const toWorld=(cx,cy)=>({x:(cx-view.x)/view.k,y:(cy-view.y)/view.k});
let mouse={x:1e9,y:1e9},layerT;
const boost=()=>{clearTimeout(layerT);world.style.willChange="transform"};      // smooth while moving
const settle=()=>{clearTimeout(layerT);layerT=setTimeout(()=>world.style.willChange="",250)}; // crisp when still
const ptr=new Map();let gest=null,pin=null;
const pinch=()=>{const [a,b]=[...ptr.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2}};
stage.addEventListener("pointerdown",e=>{
  stage.setPointerCapture(e.pointerId);boost();
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===1)gest={sx:e.clientX,sy:e.clientY,moved:false,multi:false,tgt:e.target.closest(".b")};
  else if(gest){gest.multi=true;pin=pinch()}
});
stage.addEventListener("pointermove",e=>{
  if(e.pointerType==="mouse")mouse=toWorld(e.clientX,e.clientY);
  const p=ptr.get(e.pointerId);if(!p)return;
  if(ptr.size===1){
    view.x+=e.clientX-p.x;view.y+=e.clientY-p.y;clampView();
    if(gest&&Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)>8)gest.moved=true;
  }
  p.x=e.clientX;p.y=e.clientY;
  if(ptr.size===2&&pin){
    const q=pinch(),k=Math.min(MAXK,Math.max(minK,view.k*q.d/pin.d)),r=k/view.k;
    view.x=q.mx-(pin.mx-view.x)*r;view.y=q.my-(pin.my-view.y)*r;view.k=k;clampView();pin=q;
  }
});
function up(e){
  if(!ptr.delete(e.pointerId))return;
  pin=null;
  if(ptr.size===0){
    settle();
    if(e.type==="pointerup"&&gest&&!gest.moved&&!gest.multi&&gest.tgt)openNode(gest.tgt.__q);
    gest=null;
  }else if(gest)gest.moved=true;
}
stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
stage.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")mouse={x:1e9,y:1e9}});
stage.addEventListener("wheel",e=>{e.preventDefault();boost();zoom(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX,e.clientY);settle()},{passive:false});
$("zi").onclick=()=>zoom(1.3);$("zo").onclick=()=>zoom(1/1.3);$("zr").onclick=fit;

/* ---------- BACKGROUND: small rising bubbles (cheap sprite drawing) ---------- */
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv=$("bg"),cg=cv.getContext("2d");
let bub=[];
const spr=(()=>{const s=document.createElement("canvas");s.width=s.height=48;const g=s.getContext("2d");
  g.beginPath();g.arc(24,24,19,0,7);g.fillStyle="rgba(255,236,200,.12)";g.fill();
  g.strokeStyle="rgba(255,242,220,.85)";g.lineWidth=5;g.stroke();
  g.beginPath();g.arc(17,17,5,0,7);g.fillStyle="rgba(255,255,255,.8)";g.fill();return s})();
function sizeBg(){
  const w=innerWidth,h=innerHeight;cv.width=w;cv.height=h;
  const n=Math.min(220,Math.round(w*h/8000));
  bub=Array.from({length:n},()=>{const r=1.5+Math.random()*3.5;
    return{x:Math.random()*w,y:Math.random()*h,r,v:.1+r*.06+Math.random()*.1,ph:Math.random()*6,a:.22+Math.random()*.35}});
}
function drawBg(){
  const w=innerWidth,h=innerHeight;cg.clearRect(0,0,w,h);
  for(const b of bub){
    if(!calm){b.y-=b.v;b.x+=Math.sin(b.y*.02+b.ph)*.2;if(b.y<-10){b.y=h+10;b.x=Math.random()*w}}
    cg.globalAlpha=b.a;cg.drawImage(spr,b.x-b.r,b.y-b.r,b.r*2,b.r*2);
  }
  cg.globalAlpha=1;
}
addEventListener("resize",()=>{measure();view.k=Math.max(view.k,minK);clampView();sizeBg()});

/* ---------- RENDER LOOP: only touches what actually moves ---------- */
let first=true;
function tick(){
  requestAnimationFrame(tick);
  if(sel)return;                       // card open: nothing animates, so the glass stays cheap
  if(view.dirty){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;view.dirty=false}
  if(ptr.size===0)drawBg();
  for(const q of nodes){
    q.m=false;
    let tx=0,ty=0;
    const dx=q.x-mouse.x,dy=q.y-mouse.y,d2=dx*dx+dy*dy,reach=q.r*1.9;
    if(!calm&&d2<reach*reach&&d2>.01){const d=Math.sqrt(d2),f=1-d/reach;tx=dx/d*f*4;ty=dy/d*f*4}
    const ts=(!calm&&d2<q.r*q.r)?1.014:1;
    const idle=!first&&!tx&&!ty&&Math.abs(q.ox)<.02&&Math.abs(q.oy)<.02&&Math.abs(q.vx)<.02&&Math.abs(q.vy)<.02&&Math.abs(q.s-ts)<.0005;
    if(idle){
      if(ts===1&&(q.ox||q.oy||q.s!==1)){q.ox=q.oy=q.vx=q.vy=0;q.s=1}else continue;
    }else{
      q.vx=(q.vx+(tx-q.ox)*.025)*.86;q.vy=(q.vy+(ty-q.oy)*.025)*.86;
      q.ox+=q.vx;q.oy+=q.vy;q.s+=(ts-q.s)*.08;
    }
    q.m=true;
    q.el.style.transform=`translate(${q.x+q.ox-q.r}px,${q.y+q.oy-q.r}px)`+(q.s!==1?` scale(${q.s})`:"");
  }
  first=false;
  for(const q of nodes){
    if(!q.line||!(q.m||q.parent.m))continue;const p=q.parent;
    const ax=p.x+p.ox,ay=p.y+p.oy,bx=q.x+q.ox,by=q.y+q.oy,d=Math.hypot(bx-ax,by-ay)||1,ux=(bx-ax)/d,uy=(by-ay)/d;
    q.line.setAttribute("x1",ax+ux*p.r);q.line.setAttribute("y1",ay+uy*p.r);
    q.line.setAttribute("x2",bx-ux*q.r);q.line.setAttribute("y2",by-uy*q.r);
  }
}

/* ---------- CARD: the bubble grows over the others ---------- */
const card=$("card"),scrim=$("scrim"),stars=$("stars");
let sel=null,hideT=null;
for(let i=1;i<=10;i++){
  const b=document.createElement("button");b.textContent="★";b.setAttribute("aria-label",i+" out of 10");
  b.onclick=()=>{

}

  }

  Object.assign(card.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px",borderRadius:"50%"});
  hideT=setTimeout(()=>{card.classList.remove("show");q.el.style.visibility=""},400);
}
$("x").onclick=closeCard;scrim.onclick=closeCard;
addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("join").hidden)$("join").hidden=true;else closeCard()}});

/* ---------- REFRESH UI ---------- */
function refresh(){
  nodes.forEach(q=>{
    if(q.root)return;                                   // the main bubble has no rating
    const m=stat(q,S),done=m.c===m.t;                   // branch ratings appear only when everything below is rated
    q.el.classList.toggle("tried",done);
    q.em.textContent=done?fmt(m.avg)+"/10":"";          // only MY rating is shown outside the bubble
  });
  if(!sel)return;
  $("rb").hidden=sel.root;
  if(sel.root)return;
  const m=stat(sel,S),done=m.c===m.t;
  $("stars").hidden=!sel.leaf;$("note").hidden=sel.leaf;
  $("myh").textContent=sel.leaf?"Your rating":"Your average";
  $("myv").textContent=done?fmt(m.avg)+"/10":(m.c?`${m.c} of ${m.t} rated`:"Not rated yet");
  if(sel.leaf)[...stars.children].forEach((s,i)=>s.classList.toggle("on",i<(S[sel.name]|0)));
  else $("note").textContent=done?`Average of the ${m.t} beers in this branch that you rated.`:`Rate all ${m.t} beers in this branch to see the average here.`;
  const fr=$("fr");fr.textContent="";
  O.forEach(o=>{                                        // every other person who rated this
    const s=stat(sel,o.d);if(!s.c)return;
    const row=document.createElement("div"),a=document.createElement("span"),b=document.createElement("b");
    row.className="row";a.textContent=o.name;
    b.textContent=s.c===s.t?fmt(s.avg)+"/10":`${s.c} of ${s.t} rated`;if(s.c!==s.t)b.className="part";
    row.append(a,b);fr.appendChild(row);
  });
  fr.hidden=!fr.children.length;
}

/* ---------- SYNC (Firebase Realtime Database REST) ---------- */
const enc=encodeURIComponent,safe=s=>s.trim().replace(/[.#$\[\]\/]/g,"").slice(0,24);
let pt;
const queuePush=()=>{dirty=true;ver++;clearTimeout(pt);pt=setTimeout(push,500)};
async function push(){
  if(!live())return;const v=ver;
  try{
    const r=await fetch(`${DB}/rooms/${enc(P.room)}/${enc(P.name)}.json`,{method:"PUT",body:JSON.stringify(S)});
    if(r.ok){if(v===ver)dirty=false;synced=true;store(SYK,true)}
  }catch(e){}
}
async function pull(){
  if(!live())return;
  try{
    const all=(await (await fetch(`${DB}/rooms/${enc(P.room)}.json`)).json())||{};
    if(!dirty){
      const mine=all[P.name];
      if(mine){S=prune(mine);store(SK,S)}                 // load my saved progress (any device)
      else if(synced){S={};store(SK,S)}                    // it was cleared elsewhere
      else if(Object.keys(S).length)await push();          // first upload of local ratings
      synced=true;store(SYK,true);
    }
    O=Object.keys(all).filter(k=>k!==P.name).map(k=>({name:k,d:prune(all[k])}));
    refresh();
  }catch(e){}
}
setInterval(()=>{if(!document.hidden&&!sel)pull()},12000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});

/* ---------- PROFILE ---------- */
const jo=$("join");
function showJoin(){$("jn").value=P?P.name:"";$("jr").value=P?P.room:"";$("jnote").hidden=!!DB;jo.hidden=false}
$("pf").onclick=showJoin;$("jc").onclick=()=>jo.hidden=true;
$("jf").onsubmit=e=>{
  e.preventDefault();
  const name=safe($("jn").value),room=safe($("jr").value).toLowerCase();
  if(!name){$("jn").focus();return}
  if(DB&&!room){$("jr").focus();return}
  if(DB&&(!P||P.name!==name||P.room!==room)){S={};store(SK,S);synced=false;store(SYK,false)}  // different user: start from their cloud progress
  P={name,room};store(PK,P);O=[];jo.hidden=true;refresh();pull();
};
$("clr").onclick=()=>{if(confirm("Clear all your ratings?")){S={};store(SK,S);queuePush();refresh();jo.hidden=true}};

measure();start();sizeBg();refresh();requestAnimationFrame(tick);
if(DB&&!P)showJoin();else pull();
</script>
